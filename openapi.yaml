openapi: 3.0.0
info:
  title: RESTful API Tugas
  version: 1.0.0

paths:
  /books:
    get:
      summary: Get list of books
      responses:
        '200':
          description: List of books

    post:
      summary: Create book
      responses:
        '201':
          description: Book created

  /books/{id}:
    get:
      summary: Get book by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Book detail